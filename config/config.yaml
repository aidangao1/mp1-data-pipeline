validation:
  required_columns:
    - record_id
    - name
    - rating
    - category
    - status
  numeric_columns:
    - rating     # the one(s) that should hold numbers

processing:
  remove_duplicates: true
  missing:
    enabled: true
    axis: "rows"
  outliers:
    enabled: true
    columns:
      - rating
    method: "iqr"
    threshold: 1.5